<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fari | IA Omnisciente v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #020617; font-family: 'Plus Jakarta Sans', sans-serif; }
        .chat-container { height: 500px; }
        .bubble-fari { border-radius: 20px 20px 20px 4px; background: #1e293b; color: #f1f5f9; border: 1px solid #334155; }
        .bubble-user { border-radius: 20px 20px 4px 20px; background: #3b82f6; color: white; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden">
        <div class="p-4 bg-slate-800/50 flex items-center gap-4">
            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center shadow-lg"><i class="fas fa-robot text-white"></i></div>
            <div>
                <h1 class="text-white font-bold">Fari</h1>
                <p class="text-xs text-blue-400">● Intelligence Omnisciente</p>
            </div>
        </div>

        <div id="chat-box" class="chat-container overflow-y-auto p-4 space-y-4 flex flex-col">
            <div class="bubble-fari self-start p-3 text-sm max-w-[85%]">
                Bonjour ! Je suis <b>Fari</b>. Je peux résoudre vos calculs (ex: 1+1), vous donner l'heure, ou discuter de n'importe quoi. Testez-moi !
            </div>
        </div>

        <div class="p-4 bg-slate-900 border-t border-slate-800">
            <div class="flex gap-2">
                <input type="text" id="user-input" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Posez votre question...">
                <button onclick="handleSend()" class="bg-blue-600 text-white p-2 rounded-xl hover:bg-blue-500 transition-all"><i class="fas fa-paper-plane px-2"></i></button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');

        function handleSend() {
            const text = input.value.trim();
            if(!text) return;
            addMsg(text, 'user');
            input.value = "";
            
            setTimeout(() => {
                const response = fariBrain(text);
                addMsg(response, 'fari');
            }, 600);
        }

        function fariBrain(query) {
            const q = query.toLowerCase();

            // 1. CALCULS MATHÉMATIQUES (1+1, 25*4, etc.)
            if (/[0-9]/.test(q) && /[+*/-]/.test(q)) {
                try {
                    let expression = q.replace(/[^0-9+\-*/().]/g, ""); // Nettoyage strict
                    let result = eval(expression);
                    return `Le résultat de <b>${expression}</b> est <b>${result}</b>.`;
                } catch(e) { /* on continue si ce n'est pas un calcul */ }
            }

            // 2. SALUTATIONS
            if (q.includes("salut") || q.includes("bonjour") || q.includes("hi") || q.includes("hello")) {
                return "Salut ! C'est un plaisir de vous parler. Comment se passe votre journée ?";
            }

            // 3. QUESTIONS SUR L'IDENTITÉ
            if (q.includes("qui es-tu") || q.includes("ton nom") || q.includes("fari")) {
                return "Je suis <b>Fari</b>, votre assistant intelligent. Je suis programmé pour vous aider à résoudre des problèmes et répondre à vos questions.";
            }

            // 4. CULTURE GÉNÉRALE & SCIENCE (Simulé)
            if (q.includes("science")) return "La science est la clé de la compréhension de l'univers, de l'atome aux galaxies.";
            if (q.includes("cuisine")) return "La cuisine est un art ! Mon plat préféré (en code) est le 'Spaghetti d'algorithmes'.";
            if (q.includes("code")) return "Je maîtrise le HTML, le CSS et le JavaScript. C'est d'ailleurs ce qui me fait vivre !";

            // 5. HEURE ET DATE
            if (q.includes("heure")) return "Il est actuellement " + new Date().toLocaleTimeString() + ".";
            if (q.includes("date")) return "Nous sommes le " + new Date().toLocaleDateString() + ".";

            // 6. RÉPONSE UNIVERSELLE (Si rien d'autre ne matche)
            return `C'est une question intéressante à propos de <b>"${query}"</b>. En tant que Fari, je dirais que cela nécessite une exploration détaillée. Voulez-vous que je vous donne une définition précise ?`;
        }

        function addMsg(text, type) {
            const div = document.createElement('div');
            div.className = type === 'user' ? "bubble-user self-end p-3 text-sm max-w-[85%] shadow-lg" : "bubble-fari self-start p-3 text-sm max-w-[85%] shadow-md";
            div.innerHTML = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        input.addEventListener("keypress", (e) => { if(e.key === "Enter") handleSend(); });
    </script>
</body>
</html>
