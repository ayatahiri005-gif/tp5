<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fari | IA Omnisciente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; font-family: 'Inter', sans-serif; }
        .chat-area { height: 450px; scrollbar-width: thin; }
        .fari-bubble { border-radius: 20px 20px 20px 5px; }
        .user-bubble { border-radius: 20px 20px 5px 20px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden">
        <div class="p-4 bg-slate-800/50 border-b border-slate-700 flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i class="fas fa-sparkles text-white"></i>
            </div>
            <div>
                <h2 class="text-white font-bold">Fari</h2>
                <p class="text-xs text-indigo-400">● IA Omnisciente</p>
            </div>
        </div>

        <div id="chat-box" class="chat-area overflow-y-auto p-4 space-y-4 flex flex-col">
            <div class="fari-bubble self-start bg-slate-800 text-slate-200 p-3 text-sm max-w-[85%]">
                Bonjour ! Je suis <b>Fari</b>. Je peux résoudre des calculs, répondre à vos saluts et discuter. Testez-moi !
            </div>
        </div>

        <div class="p-4 bg-slate-800/30">
            <div class="flex gap-2">
                <input type="text" id="user-input" 
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="Posez votre question...">
                <button onclick="handleResponse()" class="bg-indigo-600 text-white p-2 rounded-xl hover:bg-indigo-500">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');

        function handleResponse() {
            const val = input.value.trim();
            if(!val) return;

            addMsg(val, 'user');
            input.value = "";

            setTimeout(() => {
                const reply = logic(val);
                addMsg(reply, 'fari');
            }, 500);
        }

        function logic(str) {
            const clean = str.toLowerCase();

            // 1. Détection Mathématique (ex: 1+1, 5*5)
            if (/[0-9]/.test(clean) && /[+*/-]/.test(clean)) {
                try {
                    // Supprime tout sauf les chiffres et opérateurs pour la sécurité
                    const mathPart = clean.replace(/[^-+*/0-9.()]/g, '');
                    const result = eval(mathPart); 
                    return `Le calcul est simple : <b>${mathPart} = ${result}</b>. Autre chose ?`;
                } catch(e) { }
            }

            // 2. Salutations
            if(clean.includes("salut") || clean.includes("hi") || clean.includes("bonjour")) {
                return "Salut ! C'est un plaisir de vous voir. Que puis-je faire pour vous ?";
            }

            // 3. Questions d'identité
            if(clean.includes("qui es-tu") || clean.includes("ton nom")) {
                return "Je suis <b>Fari</b>, votre assistant intelligent conçu pour répondre à tout !";
            }

            // 4. Questions sur l'heure
            if(clean.includes("heure")) {
                return "Il est exactement " + new Date().toLocaleTimeString() + ".";
            }

            // 5. Fallback (Réponse par défaut plus "intelligente")
            return `Vous me demandez à propos de "${str}". C'est un sujet intéressant ! Pourriez-vous préciser votre pensée pour que je vous donne une réponse d'expert ?`;
        }

        function addMsg(text, type) {
            const div = document.createElement('div');
            div.className = type === 'user' 
                ? "user-bubble self-end bg-indigo-600 text-white p-3 text-sm max-w-[85%] shadow-md"
                : "fari-bubble self-start bg-slate-800 text-slate-200 p-3 text-sm max-w-[85%] border border-slate-700";
            div.innerHTML = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        input.addEventListener("keypress", (e) => { if(e.key === "Enter") handleResponse(); });
    </script>
</body>
</html>
